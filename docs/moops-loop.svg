<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="6000" viewBox="0 0 2000 6000" role="img" aria-labelledby="title description">
  <title id="title">MOOPS and Claude-Mem real iOS verification loop</title>
  <desc id="description">Fresh Codex uses required Claude-Mem recall. MOOPS validates a versioned checkpoint, rebuilds and restores the real iOS app through public tools, and returns fresh evidence that the agent inspects and verifies.</desc>

  <defs>
    <marker id="a-slate" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#64748B"/></marker>
    <marker id="a-purple" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#9333EA"/></marker>
    <marker id="a-blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#2563EB"/></marker>
    <marker id="a-indigo" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#4F46E5"/></marker>
    <marker id="a-amber" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#D97706"/></marker>
    <marker id="a-cyan" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#0891B2"/></marker>
    <marker id="a-green" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#16A34A"/></marker>
    <marker id="a-orange" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L0 8L11 4z" fill="#EA580C"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0F172A" flood-opacity=".09"/></filter>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.section{font-size:24px;font-weight:750;letter-spacing:.7px}.title{font-size:32px;font-weight:750}.body{font-size:28px}.small{font-size:24px}.label{font-size:24px;font-weight:700}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="2000" height="6000" fill="#F8FAFC"/>

  <!-- Header and section labels -->
  <g class="ui">
    <text x="220" y="78" font-size="52" font-weight="800" fill="#0F172A">MOOPS + CLAUDE-MEM</text>
    <text x="220" y="132" font-size="34" font-weight="700" fill="#334155">THE REAL iOS VERIFICATION LOOP</text>
    <rect x="1460" y="58" width="320" height="54" rx="27" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="2"/>
    <text x="1620" y="92" text-anchor="middle" class="small" font-weight="750" fill="#6B21A8">MEMORY AS A SPEED PLAY</text>
    <rect x="220" y="170" width="1560" height="70" rx="35" fill="#E2E8F0"/>
    <text x="1000" y="214" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">recall → validate → rebuild → restore → agent inspects + verifies fresh evidence</text>

    <rect x="220" y="290" width="720" height="50" rx="25" fill="#F3E8FF"/>
    <text x="248" y="324" class="section" fill="#6B21A8">1 · REQUIRED RECALL + FAIL-CLOSED VALIDATION</text>
    <rect x="220" y="2490" width="760" height="50" rx="25" fill="#E0F2FE"/>
    <text x="248" y="2524" class="section" fill="#075985">2 · REBUILD, THEN REPLAY THE SHORTEST PUBLIC ROUTE</text>
    <rect x="220" y="3820" width="570" height="50" rx="25" fill="#DCFCE7"/>
    <text x="248" y="3854" class="section" fill="#166534">3 · STATE STAYS WITH ITS REAL OWNER</text>
    <rect x="1060" y="5420" width="720" height="50" rx="25" fill="#DCFCE7"/>
    <text x="1088" y="5454" class="section" fill="#166534">4 · THE AGENT INSPECTS + VERIFIES FRESH EVIDENCE</text>
  </g>

  <!-- Connectors: 500px main gutters and dedicated outer return lanes. -->
  <g class="ui">
    <path d="M490 640V980" class="line" stroke="#9333EA" stroke-width="5" marker-end="url(#a-purple)"/>
    <path d="M760 510H1260" class="line" stroke="#60A5FA" stroke-width="4" stroke-dasharray="13 10" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>
    <path d="M490 1330V1700" class="line" stroke="#9333EA" stroke-width="5" marker-end="url(#a-purple)"/>
    <path d="M1260 1875H760" class="line" stroke="#64748B" stroke-width="5" marker-end="url(#a-slate)"/>
    <path d="M490 2050V2280H1010V2550H490V2600" class="line" stroke="#2563EB" stroke-width="5" marker-end="url(#a-blue)"/>

    <path d="M760 2740H1260" class="line" stroke="#64748B" stroke-width="5" marker-end="url(#a-slate)"/>
    <path d="M1530 2880V3300" class="line" stroke="#4F46E5" stroke-width="5" marker-end="url(#a-indigo)"/>
    <path d="M1260 3440H760" class="line" stroke="#D97706" stroke-width="5" marker-end="url(#a-amber)"/>

    <path d="M220 3440H140V4800H220" class="line" stroke="#0891B2" stroke-width="4" marker-end="url(#a-cyan)"/>
    <path d="M760 3440H1900V5660H1780" class="line" stroke="#0891B2" stroke-width="4" marker-end="url(#a-cyan)"/>
    <path d="M480 5100V5510" class="line" stroke="#EA580C" stroke-width="4" marker-start="url(#a-orange)" marker-end="url(#a-orange)"/>
    <path d="M740 5660H1060" class="line" stroke="#EA580C" stroke-width="4" marker-end="url(#a-orange)"/>
    <path d="M1420 5810V5900H40V510H220" class="line" stroke="#16A34A" stroke-width="5" stroke-dasharray="15 11" marker-end="url(#a-green)"/>
  </g>

  <!-- Recall and admission -->
  <g class="ui" filter="url(#shadow)">
    <rect x="220" y="380" width="540" height="260" rx="24" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
    <text x="260" y="438" class="title" fill="#FFF">FRESH CODEX PROCESS</text>
    <text x="260" y="500" class="body" fill="#E2E8F0">
      <tspan x="260">Edits the real Xcode project.</tspan>
      <tspan x="260" dy="43">Calls MOOPS and receives evidence.</tspan>
      <tspan x="260" dy="52" fill="#94A3B8" font-weight="750">Agent owns inspection + verification.</tspan>
    </text>

    <rect x="1260" y="380" width="540" height="260" rx="24" fill="#FFF" stroke="#60A5FA" stroke-width="3" stroke-dasharray="12 9"/>
    <text x="1300" y="438" class="title" fill="#1E3A8A">XCODE PROJECT + MCP</text>
    <text x="1300" y="510" class="body" fill="#334155">Codex inspects and edits the real project.</text>
    <text x="1300" y="558" class="body" fill="#334155">The project bridge stays outside MOOPS.</text>

    <rect x="220" y="980" width="540" height="350" rx="24" fill="#FAF5FF" stroke="#9333EA" stroke-width="4"/>
    <text x="260" y="1042" class="title" fill="#581C87">CLAUDE-MEM · REQUIRED</text>
    <text x="260" y="1088" class="mono small" fill="#7E22CE">search → timeline → get_observations</text>
    <text x="260" y="1150" class="body" fill="#581C87">
      <tspan x="260">Fresh Codex recalls captured descriptors.</tspan>
      <tspan x="260" dy="39">Selects </tspan><tspan font-weight="750">checkout-ready</tspan><tspan> with path + fingerprint.</tspan>
      <tspan x="260" dy="39">Never app process memory.</tspan>
      <tspan x="260" dy="48" font-weight="750">Recall failure stops the workflow.</tspan>
    </text>

    <rect x="220" y="1700" width="540" height="350" rx="24" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
    <image href="assets/nodejs-icon.svg" x="260" y="1760" width="90" height="102" preserveAspectRatio="xMidYMid meet"/>
    <text x="390" y="1764" class="title" fill="#1E3A8A">MOOPS CLI · NODE.JS</text>
    <text x="390" y="1807" class="mono small" fill="#2563EB">tools/moops/moops</text>
    <text x="260" y="1880" class="small" fill="#1E3A8A">
      <tspan x="260">• validate schema + canonical SHA-256</tspan>
      <tspan x="260" dy="34">• check app + simulator preconditions</tspan>
      <tspan x="260" dy="34">• build → install → launch → replay → capture</tspan>
      <tspan x="260" dy="34">• stop on the first failed phase</tspan>
      <tspan x="260" dy="34">• return stable JSON evidence</tspan>
    </text>

    <rect x="1260" y="1700" width="540" height="350" rx="24" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    <text x="1300" y="1762" class="title" fill="#78350F">VERSIONED CHECKPOINT</text>
    <text x="1300" y="1820" class="small" fill="#78350F">
      <tspan x="1300">• app + simulator identity</tspan>
      <tspan x="1300" dy="35">• declared fixture version</tspan>
      <tspan x="1300" dy="35">• direct adapter arguments</tspan>
      <tspan x="1300" dy="35">• public wait + tap trace</tspan>
      <tspan x="1300" dy="35">• UI landing predicates</tspan>
      <tspan x="1300" dy="46" font-weight="750">Descriptor + replay recipe. Never a snapshot.</tspan>
    </text>

    <rect x="1260" y="2210" width="540" height="180" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="1300" y="2270" class="title" fill="#9A3412">FAIL-CLOSED ADMISSION</text>
    <text x="1300" y="2320" class="small" fill="#9A3412">Bad fingerprint, missing state, failed trace,</text>
    <text x="1300" y="2356" class="small" fill="#9A3412">or failed predicate → exact JSON error.</text>
  </g>

  <!-- Rebuild and public replay -->
  <g class="ui" filter="url(#shadow)">
    <rect x="220" y="2600" width="540" height="280" rx="24" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
    <image href="assets/xcode-icon.png" x="260" y="2680" width="110" height="110" preserveAspectRatio="xMidYMid meet"/>
    <text x="415" y="2672" class="title" fill="#1E3A8A">1 · BUILD</text>
    <text x="415" y="2720" class="mono small" fill="#2563EB">xcodebuild build-for-testing</text>
    <text x="415" y="2782" class="body" fill="#1E3A8A">Compile the structural edit</text>
    <text x="415" y="2824" class="body" fill="#1E3A8A">into a new app binary.</text>

    <rect x="1260" y="2600" width="540" height="280" rx="24" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3"/>
    <text x="1300" y="2672" class="title" fill="#312E81">2 · INSTALL</text>
    <text x="1300" y="2720" class="mono small" fill="#4F46E5">simctl install</text>
    <text x="1300" y="2782" class="body" fill="#312E81">Replace the app binary without uninstalling.</text>
    <text x="1300" y="2824" class="body" font-weight="750" fill="#312E81">The installed app sandbox stays.</text>

    <rect x="1260" y="3300" width="540" height="280" rx="24" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
    <text x="1300" y="3372" class="title" fill="#78350F">3 · LAUNCH</text>
    <text x="1300" y="3420" class="mono small" fill="#D97706">simctl launch</text>
    <text x="1300" y="3482" class="body" fill="#78350F">Start a new operating-system process.</text>
    <text x="1300" y="3524" class="body" font-weight="750" fill="#78350F">In-memory views and navigation are gone.</text>

    <rect x="220" y="3300" width="540" height="280" rx="24" fill="#ECFEFF" stroke="#0891B2" stroke-width="3"/>
    <text x="260" y="3372" class="title" fill="#164E63">4 · XCUITEST REPLAY</text>
    <text x="260" y="3420" class="small" fill="#0891B2">Apple black-box UI automation</text>
    <text x="260" y="3482" class="body" fill="#164E63">Reacquire elements. Wait + tap by accessibility ID.</text>
    <text x="260" y="3524" class="body" font-weight="750" fill="#164E63">Return a fresh machine-readable UI tree.</text>
  </g>

  <!-- State ownership -->
  <g class="ui">
    <rect x="220" y="3910" width="1560" height="210" rx="24" fill="#0F172A" stroke="#0F172A" stroke-width="2"/>
    <text x="270" y="3975" class="title" fill="#FFF">THE KEY BOUNDARY</text>
    <text x="270" y="4032" class="body" fill="#E2E8F0">Claude-Mem recalls a descriptor. MOOPS validates and executes it.</text>
    <text x="270" y="4080" class="body" font-weight="750" fill="#94A3B8">Neither one serializes, copies, or fabricates app state.</text>

    <rect x="220" y="4500" width="1560" height="600" rx="26" fill="#F0FDF4" stroke="#059669" stroke-width="3"/>
    <text x="280" y="4575" font-size="34" font-weight="750" fill="#065F46">REAL iOS APP · Swift / SwiftUI · installed simulator data container</text>

    <rect x="280" y="4640" width="560" height="390" rx="22" fill="#FFF" stroke="#4ADE80" stroke-width="3"/>
    <text x="325" y="4710" class="title" fill="#14532D">SURVIVES REBUILD</text>
    <text x="325" y="4752" class="small" fill="#047857">installed app sandbox</text>
    <text x="325" y="4820" class="body" fill="#14532D">
      <tspan x="325">• authenticated session</tspan>
      <tspan x="325" dy="44">• Core Data cart (local database)</tspan>
      <tspan x="325" dy="44">• UserDefaults preference (local key-value storage)</tspan>
      <tspan x="325" dy="58" font-weight="750" fill="#047857">MOOPS validates it. MOOPS never copies it.</tspan>
    </text>

    <rect x="1160" y="4640" width="560" height="390" rx="22" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
    <text x="1205" y="4710" class="title" fill="#78350F">RECREATED AFTER LAUNCH</text>
    <text x="1205" y="4752" class="small" fill="#B45309">new operating-system process</text>
    <text x="1205" y="4820" class="body" fill="#78350F">
      <tspan x="1205">• SwiftUI view objects</tspan>
      <tspan x="1205" dy="44">• view-model memory</tspan>
      <tspan x="1205" dy="44">• NavigationStack (in-memory screen path)</tspan>
      <tspan x="1205" dy="58" font-weight="750" fill="#B45309">Public XCUITest replay rebuilds navigation.</tspan>
    </text>
  </g>

  <!-- Backend truth and agent verification -->
  <g class="ui" filter="url(#shadow)">
    <rect x="220" y="5510" width="520" height="300" rx="24" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
    <text x="265" y="5580" class="title" fill="#7C2D12">NODE.JS BACKEND</text>
    <text x="265" y="5624" class="small" fill="#C2410C">separate process + truth boundary</text>
    <text x="265" y="5690" class="body" fill="#7C2D12">GET catalog + prices</text>
    <text x="265" y="5732" class="body" fill="#7C2D12">POST /orders</text>
    <text x="265" y="5780" class="small" font-weight="750" fill="#7C2D12">Independent receipt. Never checkpointed.</text>

    <rect x="1060" y="5510" width="720" height="300" rx="24" fill="#ECFDF5" stroke="#16A34A" stroke-width="4"/>
    <text x="1105" y="5580" class="title" fill="#14532D">AGENT INSPECTS + VERIFIES</text>
    <text x="1105" y="5632" class="small" fill="#14532D"><tspan font-weight="750">MOOPS report</tspan><tspan> · checkpoint + fingerprint</tspan></text>
    <text x="1105" y="5670" class="small" fill="#14532D">failed/passed phase + landing predicates</text>
    <text x="1105" y="5708" class="small" fill="#14532D"><tspan font-weight="750">Backend receipt</tspan><tspan> · exact POST /orders payload</tspan></text>
    <text x="1105" y="5752" class="small" font-weight="750" fill="#166534">All checks pass → continue.</text>
    <text x="1105" y="5790" class="small" font-weight="750" fill="#B45309">Mismatch → return the exact failed phase.</text>
  </g>

  <!-- Connector labels are offset from every path. -->
  <g class="ui">
    <text x="530" y="820" class="label" fill="#7E22CE">query memory</text>
    <text x="1010" y="478" text-anchor="middle" class="label" fill="#2563EB">inspect + edit</text>
    <text x="530" y="1515" class="label" fill="#7E22CE">recalled descriptor</text>
    <text x="1010" y="1835" text-anchor="middle" class="label" fill="#475569">checkpoint input</text>
    <text x="1045" y="2395" class="label" fill="#1D4ED8">validated restore recipe</text>
    <text x="1010" y="2705" text-anchor="middle" class="label" fill="#475569">new binary</text>
    <text x="1565" y="3100" class="label" fill="#4338CA">keep app sandbox</text>
    <text x="1010" y="3405" text-anchor="middle" class="label" fill="#B45309">new process</text>
    <text x="176" y="4310" transform="rotate(-90 176 4310)" class="label" fill="#0E7490">PUBLIC REPLAY</text>
    <text x="1940" y="4740" transform="rotate(-90 1940 4740)" class="label" fill="#0E7490">MOOPS JSON + FRESH UI TREE</text>
    <text x="520" y="5315" class="label" fill="#C2410C">HTTP GET + POST</text>
    <text x="900" y="5620" text-anchor="middle" class="label" fill="#C2410C">POST receipt</text>
    <rect x="70" y="2800" width="46" height="280" rx="23" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="94" y="3010" transform="rotate(-90 94 3010)" class="label" fill="#166534">REPEAT UNTIL DONE</text>
  </g>
</svg>
